# nginx на F-Stack, сценарий 2. Метки @...@ подставляет s2_nginx.sh,
# относительные пути — от каталога точки (nginx -p).
# Воркер k работает на k-м ядре из lcore_mask в f-stack.conf, поэтому worker_cpu_affinity не нужен.
user                 root;      # DPDK требует root
worker_processes     @WORKERS@;
fstack_conf          @RUN@/f-stack.conf;
worker_rlimit_nofile 262144;
pid                  nginx.pid;
error_log            logs/error.log error;

events {
    use kqueue;
    worker_connections 102400;
}

http {
    default_type   application/octet-stream;
    access_log     off;
    server_tokens  off;
    etag           off;

    sendfile       off;         # на сокетах F-Stack sendfile не работает
    tcp_nodelay    on;
    output_buffers 2 256k;
    open_file_cache       max=64 inactive=600s;
    open_file_cache_valid 600s;

    keepalive_timeout  300s;
    keepalive_requests 1000000000;

    server {
        listen 80 backlog=65535;
        # Ответы: /n<N>/<размер>, где N — число воркеров, с которым nginx запущен по плану клиента.
        # Если сервер и клиент разошлись по точкам, nginx отвечает 404 и клиент видит httpErr.
        location /n@WORKERS@/ {
            alias @ROOT@/;
        }
    }
}
