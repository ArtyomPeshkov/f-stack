# Reference HTTP target for validating wrk before pointing it at F-Stack.
#
# Two uses:
#   1. Sanity target on a spare Linux box: confirms the generator and the
#      network path work before F-Stack is in the picture. If wrk cannot
#      saturate this, it will not saturate F-Stack either.
#   2. Template for ladder rung 3 (stock F-Stack + bundled nginx). For that
#      case build app/nginx-1.28.0 --with-ff_module and add the ff directives;
#      the location blocks below stay identical.
#
# Bodies are returned inline rather than from disk so no filesystem I/O enters
# the benchmark path. Sizes match the cases in the F-Stack README:
#   /       10 bytes   - minimal, isolates per-request overhead
#   /600    600 bytes  - CPS and RPS shape
#   /3700   3700 bytes - bandwidth shape
#
# Run standalone (no root needed on port 8080):
#   nginx -p $(pwd) -c nginx-target.conf
#   nginx -p $(pwd) -c nginx-target.conf -s stop

worker_processes  auto;
worker_rlimit_nofile 1048576;
daemon on;
error_log  logs/error.log crit;
pid        logs/nginx.pid;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    access_log off;

    # Keep-alive settings matter enormously for RPS vs CPS separation.
    # keepalive_requests must be high or the server forces reconnects
    # partway through a "keep-alive" run and you silently measure a mix.
    keepalive_timeout  65;
    keepalive_requests 1000000;

    server {
        listen 8080 reuseport backlog=8192;

        location /      { return 200 'XXXXXXXXXX'; }
        location /600   { return 200 ''; }
        location /3700  { return 200 ''; }
    }
}
